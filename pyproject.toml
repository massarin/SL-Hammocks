[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sl-hammocks"
version = "1.0.0"
description = "Mock catalogs of gravitationally lensed quasars and supernovae from a halo-model approach"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Katsuya T. Abe", email = "ktabecosmology@gmail.com" },
    { name = "Masamune Oguri" },
]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "colossus",
    "joblib",
    # not on PyPI: C extension built from source by its Makefile, needs gsl and cfitsio
    "glafic @ git+https://github.com/massarin/glafic2.git@559c68b5d3c9db62172319ee79e662300842a2fa",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/LSSTDESC/SL-Hammocks"

[tool.setuptools]
py-modules = [
    "gen_mock_halo",
    "gen_pop_halo",
    "global_value",
    "lens_gals",
    "lens_halo",
    "lens_subhalo",
    "solve_lenseq",
    "solve_lenseq_glafic",
    "source_qso",
    "source_sn",
    "source_tab",
]

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []

fixable = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
